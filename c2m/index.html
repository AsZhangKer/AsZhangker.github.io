<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>ChatColor ⇄ MiniMessage 转换器</title>

<!-- Font Awesome 6 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous" referrerpolicy="no-referrer" />

<style>
@font-face { font-display:swap; font-family:'PixelFont'; src:url('font.otf') format('opentype'); }

:root {
    --neutral-background: #48494A;
    --neutral-background-hovered: #58585A;
    --neutral-background-pressed: #313233;
    --neutral-shadow: #313233;
    --neutral-text: #FFFFFF;
    --neutral-text-dimmer: #D0D1D4;
    --neutral-text-dimmest: #B1B2B5;
    --neutral-border: #1E1E1F;
    --neutral-border-focused: #FFFFFF;
    --neutral-specular-default-top-left: rgba(255,255,255,0.6);
    --neutral-specular-default-bottom-right: rgba(255,255,255,0.4);
    --neutral-specular-top-left: rgba(255,255,255,0.2);
    --neutral-specular-bottom-right: rgba(255,255,255,0.1);
    --neutral-background-disabled: #D0D1D4;
    --neutral-shadow-disabled: #B1B2B5;
    --neutral-text-disabled: #48494A;
    --neutral-border-disabled: #8C8D90;
    --neutral-20-text: #1E1E1F;
    --primary-background: #3C8527;
    --primary-background-hovered: #2A641C;
    --primary-background-pressed: #1D4D13;
    --primary-shadow: #1D4D13;
    --primary-text: #FFFFFF;
    --primary-border: #1E1E1F;
    --secondary-background: #D0D1D4;
    --secondary-background-hovered: #B1B2B5;
    --secondary-background-pressed: #B1B2B5;
    --secondary-shadow: #58585A;
    --secondary-text: #1E1E1F;
    --secondary-border: #1E1E1F;
    --destructive-background: #CA3636;
    --destructive-background-hovered: #C02D2D;
    --destructive-background-pressed: #AD1D1D;
    --destructive-shadow: #AD1D1D;
    --destructive-text: #FFFFFF;
    --destructive-border: #1E1E1F;
    --gray-20: #E6E8EB;
    --gray-30: #D0D1D4;
    --gray-40: #B1B2B5;
    --gray-50: #8D8D90;
    --gray-60: #58585A;
    --gray-70: #48494A;
    --gray-80: #313233;
    --gray-90: #242425;
    --gray-100: #1E1E1F;
    --black: #000000;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

body {
    min-height: 100vh;
    background: #000;
    color: var(--neutral-text);
    font-family: 'PixelFont', 'NotoSans Bold', sans-serif;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
}

.page-wrap {
    position: relative; z-index: 1;
    max-width: 860px;
    margin: 0 auto;
    padding: 40px 24px 60px 24px;
    display: flex; flex-direction: column; gap: 20px;
}

.page-title {
    text-align: center;
    font-size: 1.6rem;
    font-weight: bold;
    letter-spacing: 3px;
    color: var(--neutral-text-dimmer);
    padding-bottom: 12px;
    border-bottom: 2px solid var(--neutral-border);
}

.section-label {
    font-size: 0.85rem;
    color: var(--neutral-text-dimmest);
    letter-spacing: 2px;
    display: flex; align-items: center; gap: 8px;
}

.oreui-textarea {
    width: 100%;
    min-height: 140px;
    background-color: var(--gray-80);
    border: 2px solid var(--gray-100);
    box-shadow: inset 0 4px var(--gray-90);
    caret-color: #6CC349;
    color: var(--neutral-text);
    font-family: 'PixelFont', 'NotoSans Bold', monospace;
    font-size: 0.95rem;
    line-height: 1.6;
    outline: none;
    padding: 12px 14px;
    resize: vertical;
}
.oreui-textarea:focus { border-color: var(--neutral-border-focused); }
.oreui-textarea::placeholder { color: rgba(177,178,181,0.5); }
.oreui-textarea::selection { background-color: rgba(108, 195, 73, 0.5); }
.oreui-textarea:read-only { background-color: var(--gray-90); color: var(--neutral-text-dimmer); cursor: default; }

.btn-row {
    display: flex; flex-wrap: wrap; gap: 10px;
}

.oreui-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 44px;
    padding: 0 20px;
    border: none; outline: none;
    font-family: 'PixelFont', 'NotoSans Bold', sans-serif;
    font-size: 0.95rem;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.1s ease;
    border-radius: 0 !important;
    white-space: nowrap;
}

.oreui-btn.btn-white {
    border: 2px solid var(--neutral-border);
    background-color: var(--secondary-background);
    box-shadow: inset 0 -4px var(--secondary-shadow),
                inset 3px 3px var(--neutral-specular-default-top-left),
                inset -3px -7px var(--neutral-specular-default-bottom-right);
    color: var(--neutral-20-text);
}
.oreui-btn.btn-white:hover:not(:disabled) {
    background-color: var(--secondary-background-hovered);
    box-shadow: inset 0 -4px var(--secondary-shadow),
                inset 3px 3px rgba(255,255,255,0.8),
                inset -3px -7px rgba(255,255,255,0.6);
}
.oreui-btn.btn-white:active:not(:disabled) {
    background-color: var(--secondary-background-pressed);
    box-shadow: inset 3px 3px rgba(255,255,255,0.8),
                inset -3px -3px rgba(255,255,255,0.6);
}

.oreui-btn.btn-green {
    border: 2px solid var(--primary-border);
    background-color: var(--primary-background);
    box-shadow: inset 0 -4px var(--primary-shadow),
                inset 3px 3px var(--neutral-specular-top-left),
                inset -3px -7px var(--neutral-specular-bottom-right);
    color: var(--primary-text);
}
.oreui-btn.btn-green:hover:not(:disabled) {
    background-color: var(--primary-background-hovered);
    box-shadow: inset 0 -4px var(--primary-shadow),
                inset 3px 3px rgba(255,255,255,0.4),
                inset -3px -7px rgba(255,255,255,0.3);
}
.oreui-btn.btn-green:active:not(:disabled) {
    background-color: var(--primary-background-pressed);
    box-shadow: inset 3px 3px rgba(255,255,255,0.4),
                inset -3px -3px rgba(255,255,255,0.3);
}

.oreui-btn.btn-red {
    border: 2px solid var(--destructive-border);
    background-color: var(--destructive-background);
    box-shadow: inset 0 -4px var(--destructive-shadow),
                inset 3px 3px var(--neutral-specular-top-left),
                inset -3px -7px var(--neutral-specular-bottom-right);
    color: var(--destructive-text);
}
.oreui-btn.btn-red:hover:not(:disabled) {
    background-color: var(--destructive-background-hovered);
}
.oreui-btn.btn-red:active:not(:disabled) {
    background-color: var(--destructive-background-pressed);
}

.oreui-btn.btn-gray {
    border: 2px solid var(--neutral-border);
    background-color: var(--gray-70);
    box-shadow: inset 0 -4px var(--gray-90),
                inset 3px 3px rgba(255,255,255,0.15),
                inset -3px -3px rgba(255,255,255,0.08);
    color: var(--neutral-text);
}
.oreui-btn.btn-gray:hover:not(:disabled) {
    background-color: var(--gray-60);
}
.oreui-btn.btn-gray:active:not(:disabled) {
    background-color: var(--gray-80);
    box-shadow: inset 3px 3px rgba(0,0,0,0.3),
                inset -3px -3px rgba(255,255,255,0.05);
}

.oreui-btn:disabled { cursor: not-allowed; opacity: 0.45; }

.preview-box {
    background-color: var(--gray-80);
    border: 2px solid var(--gray-100);
    box-shadow: inset 0 4px var(--gray-90);
    min-height: 60px;
    padding: 14px 16px;
    font-family: 'PixelFont', 'NotoSans Bold', monospace;
    font-size: 1rem;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-all;
    color: var(--neutral-text);
}

.unsupported-warn {
    background: rgba(202,54,54,0.15);
    border: 2px solid var(--destructive-border);
    padding: 12px 16px;
}
.warn-msg {
    font-size: 0.85rem;
    color: var(--destructive-text);
    letter-spacing: 1px;
    line-height: 1.5;
}

.copy-toast {
    position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
    background: var(--gray-100);
    color: var(--primary-background);
    border: 2px solid var(--primary-background);
    padding: 10px 28px;
    font-family: 'PixelFont', 'NotoSans Bold', sans-serif;
    font-size: 0.9rem;
    letter-spacing: 2px;
    z-index: 100;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
}
.copy-toast.show { opacity: 1; }

@media (max-width: 600px) {
    .page-wrap { padding: 24px 14px 40px 14px; gap: 14px; }
    .page-title { font-size: 1.2rem; letter-spacing: 1px; }
    .oreui-textarea { min-height: 120px; font-size: 0.85rem; padding: 10px 12px; }
    .oreui-btn { height: 40px; padding: 0 14px; font-size: 0.85rem; letter-spacing: 0; flex: 1 1 calc(50% - 5px); }
    .btn-row { gap: 8px; }
    .preview-box { font-size: 0.85rem; padding: 10px 12px; }
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #48494a; border: 1px solid #000; }
::-webkit-scrollbar-thumb:hover { background: #58585a; }
</style>

<body>

<div class="page-wrap">

    <div class="page-title" id="pageTitle">
        <i class="fa-solid fa-code"></i> ChatColor &rarr; MiniMessage 转换器
    </div>

    <div class="section-label" id="inputLabel">
        <i class="fa-solid fa-pen-to-square"></i> 输入 ChatColor 格式文本
    </div>
    <textarea id="input" class="oreui-textarea" placeholder="在此输入 & 格式的文本，例如：&aHello &cWorld" spellcheck="false"></textarea>

    <div class="btn-row">
        <button class="oreui-btn btn-green" id="swapBtn" title="切换方向">
            <i class="fa-solid fa-right-left"></i> 切换方向
        </button>
        <button class="oreui-btn btn-white" id="copyBtn" title="复制结果">
            <i class="fa-solid fa-copy"></i> 复制结果
        </button>
        <button class="oreui-btn btn-gray" id="clearBtn" title="清空">
            <i class="fa-solid fa-eraser"></i> 清空
        </button>
        <button class="oreui-btn btn-red" id="exampleBtn" title="填入示例">
            <i class="fa-solid fa-shuffle"></i> 随机示例
        </button>
    </div>

    <!-- Unsupported tag warning -->
    <div class="unsupported-warn" id="unsupportedWarn" style="display:none;">
        <div class="warn-msg">
            <i class="fa-solid fa-triangle-exclamation"></i>
            检测到不支持的标签（hover / click / gradient / shadow / key 等），请选择处理方式：
        </div>
        <div class="btn-row" style="margin-top:8px;">
            <button class="oreui-btn btn-red" id="forceBtn" title="强行转换">
                <i class="fa-solid fa-forward"></i> 强行转换
            </button>
            <button class="oreui-btn btn-white" id="stripBtn" title="去除后转换">
                <i class="fa-solid fa-filter"></i> 去除后转换
            </button>
        </div>
    </div>

    <div class="section-label" id="outputLabel">
        <i class="fa-solid fa-file-code"></i> MiniMessage 输出
    </div>
    <textarea id="output" class="oreui-textarea" placeholder="转换后的 MiniMessage 将显示在这里" readonly spellcheck="false"></textarea>

    <div class="section-label">
        <i class="fa-solid fa-eye"></i> 渲染预览
    </div>
    <div id="preview" class="preview-box">
        （将显示渲染后的效果）
    </div>

</div>

<div class="copy-toast" id="copyToast">
    <i class="fa-solid fa-circle-check"></i> 已复制到剪贴板
</div>

<script>
// ============================================================
// 1. 颜色映射表
// ============================================================
var COLOR_MAP = {
    '0': 'black', '1': 'dark_blue', '2': 'dark_green', '3': 'dark_aqua',
    '4': 'dark_red', '5': 'dark_purple', '6': 'gold', '7': 'gray',
    '8': 'dark_gray', '9': 'blue', 'a': 'green', 'b': 'aqua',
    'c': 'red', 'd': 'light_purple', 'e': 'yellow', 'f': 'white'
};

var STYLE_MAP = {
    'l': 'bold', 'o': 'italic', 'n': 'underlined',
    'm': 'strikethrough', 'k': 'obfuscated', 'r': 'reset'
};

var ALL_CODES = new Set(Object.keys(COLOR_MAP).concat(Object.keys(STYLE_MAP)));

var REV_COLOR = {};
var REV_STYLE = {};
for (var k in COLOR_MAP) { REV_COLOR[COLOR_MAP[k]] = k; }
for (var k in STYLE_MAP) { REV_STYLE[STYLE_MAP[k]] = k; }
var ALL_NAMES = new Set(Object.keys(REV_COLOR).concat(Object.keys(REV_STYLE)));

var DIR = 0;

// ============================================================
// 2. ChatColor → MiniMessage
// ============================================================
function convertChatColorToMiniMessage(input) {
    if (!input) return '';
    var text = input.replace(/§/g, '&');
    var segments = [];
    var activeStyles = [];
    var buffer = '';

    function isColorName(name) {
        var vals = Object.values(COLOR_MAP);
        for (var i = 0; i < vals.length; i++) {
            if (vals[i] === name) return true;
        }
        return false;
    }

    function findLastColorIndex(arr) {
        for (var i = arr.length - 1; i >= 0; i--) {
            if (isColorName(arr[i]) || arr[i].indexOf('color:#') === 0) {
                return i;
            }
        }
        return -1;
    }

    for (var i = 0; i < text.length; i++) {
        var ch = text[i];

        if (ch === '&') {
            if (i + 1 < text.length) {
                var next = text[i + 1];

                // &#xxxxxx
                if (next === '#') {
                    var hexMatch = text.substring(i).match(/^&#([0-9a-fA-F]{6})([0-9a-fA-F]{2})?/);
                    if (hexMatch) {
                        if (buffer) {
                            segments.push({ text: buffer, styles: activeStyles.slice() });
                            buffer = '';
                        }
                        var hex = hexMatch[1];
                        var colorIdx = findLastColorIndex(activeStyles);
                        if (colorIdx >= 0) {
                            activeStyles.splice(colorIdx, 1);
                        }
                        activeStyles.push('color:#' + hex);
                        i += hexMatch[0].length - 1;
                        continue;
                    }
                    buffer += ch;
                    continue;
                }

                var code = next.toLowerCase();
                if (ALL_CODES.has(code)) {
                    if (buffer) {
                        segments.push({ text: buffer, styles: activeStyles.slice() });
                        buffer = '';
                    }

                    if (code === 'r') {
                        activeStyles = [];
                    } else if (COLOR_MAP[code]) {
                        var colorIdx = findLastColorIndex(activeStyles);
                        if (colorIdx >= 0) {
                            activeStyles.splice(colorIdx, 1);
                        }
                        activeStyles.push(COLOR_MAP[code]);
                    } else if (STYLE_MAP[code]) {
                        var styleName = STYLE_MAP[code];
                        var idx = activeStyles.indexOf(styleName);
                        if (idx >= 0) {
                            activeStyles.splice(idx, 1);
                        } else {
                            activeStyles.push(styleName);
                        }
                    }
                    i++;
                    continue;
                }
            }
            buffer += ch;
        } else {
            buffer += ch;
        }
    }

    if (buffer) {
        segments.push({ text: buffer, styles: activeStyles.slice() });
    }

    var result = '';
    for (var k = 0; k < segments.length; k++) {
        var seg = segments[k];
        if (!seg.text) continue;
        var styles = seg.styles;
        if (styles.length === 0) {
            result += escapeMiniMessage(seg.text);
        } else {
            var openTags = '';
            var closeTags = '';
            for (var m = 0; m < styles.length; m++) {
                openTags += '<' + styles[m] + '>';
            }
            for (var n = styles.length - 1; n >= 0; n--) {
                var s = styles[n];
                if (s.indexOf('color:#') === 0) {
                    closeTags += '</color>';
                } else {
                    closeTags += '</' + s + '>';
                }
            }
            result += openTags + escapeMiniMessage(seg.text) + closeTags;
        }
    }

    return result;
}

// ============================================================
// 3. MiniMessage → ChatColor (完全重写，基于状态机)
// ============================================================
function convertMiniMessageToChatColor(input) {
    if (!input) return '';

    var out = '';
    var i = 0;

    // 样式栈: 存储当前生效的样式
    var stack = [];

    // 判断是否是颜色标签
    function isColorTag(name) {
        return REV_COLOR[name] !== undefined || (name && name.indexOf('color:#') === 0);
    }

    // 获取栈中最后一个颜色的索引
    function lastColorIndex() {
        for (var p = stack.length - 1; p >= 0; p--) {
            if (isColorTag(stack[p])) return p;
        }
        return -1;
    }

    // 将当前栈中的样式输出为 ChatColor 格式
    function emitStack() {
        for (var p = 0; p < stack.length; p++) {
            var item = stack[p];
            if (REV_COLOR[item]) {
                out += '&' + REV_COLOR[item];
            } else if (REV_STYLE[item]) {
                out += '&' + REV_STYLE[item];
            } else if (item && item.indexOf('color:#') === 0) {
                var hex = item.replace('color:#', '');
                out += '&#' + hex;
            }
        }
    }

    while (i < input.length) {
        var ch = input[i];

        // 转义字符
        if (ch === '\\' && i + 1 < input.length) {
            out += input[i + 1];
            i += 2;
            continue;
        }

        // 处理标签
        if (ch === '<') {
            // 查找闭合的 >
            var end = input.indexOf('>', i);
            if (end === -1) {
                // 没有 >，当作普通字符
                out += ch;
                i++;
                continue;
            }

            var tagContent = input.slice(i + 1, end);
            var isClosing = (i + 1 < input.length && input[i + 1] === '/');

            // ================================================
            // 闭合标签 </...>
            // ================================================
            if (isClosing) {
                var closeName = tagContent.slice(1); // 去掉开头的 /

                // </color> / </color:xxx> 闭合
                if (closeName === 'color' || /^color:/.test(closeName)) {
                    var idx = lastColorIndex();
                    if (idx >= 0) { stack.splice(idx, 1); }
                    i = end + 1;
                    continue;
                }

                // </#xxxxxx> 闭合
                var shortCloseMatch = closeName.match(/^#([0-9a-fA-F]{6})$/);
                if (shortCloseMatch) {
                    var idx2 = lastColorIndex();
                    if (idx2 >= 0) { stack.splice(idx2, 1); }
                    i = end + 1;
                    continue;
                }

                // </样式名> 闭合
                if (ALL_NAMES.has(closeName) || closeName === 'reset') {
                    var idx2 = stack.indexOf(closeName);
                    if (idx2 >= 0) {
                        stack.splice(idx2, 1);
                    }
                    i = end + 1;
                    continue;
                }

                // 不支持的闭合标签 → 静默跳过
                var closeBase = closeName.replace(/:.*$/, '');
                if (U_BASES.indexOf(closeBase.toLowerCase()) !== -1) {
                    i = end + 1;
                    continue;
                }

                // 未知闭合标签 → 当作普通文字
                out += input.slice(i, end + 1);
                i = end + 1;
                continue;
            }

            // ================================================
            // 开标签 <...>
            // ================================================

            // 检查标签名是否合法
            var isValidTag = /^[a-zA-Z0-9:_#]+$/.test(tagContent);
            if (!isValidTag) {
                out += input.slice(i, end + 1);
                i = end + 1;
                continue;
            }

            // <color:#xxxxxx>
            var colorMatch = tagContent.match(/^color:#([0-9a-fA-F]{6})$/);
            if (colorMatch) {
                var hex = colorMatch[1];
                var idx = lastColorIndex();
                if (idx >= 0) { stack.splice(idx, 1); }
                stack.push('color:#' + hex);
                out += '&#' + hex;
                i = end + 1;
                continue;
            }

            // <#xxxxxx>
            var shortHexMatch = tagContent.match(/^#([0-9a-fA-F]{6})$/);
            if (shortHexMatch) {
                var hex2 = shortHexMatch[1];
                var idx2 = lastColorIndex();
                if (idx2 >= 0) { stack.splice(idx2, 1); }
                stack.push('color:#' + hex2);
                out += '&#' + hex2;
                i = end + 1;
                continue;
            }

            // <reset>
            if (tagContent === 'reset') {
                stack = [];
                out += '&r';
                i = end + 1;
                continue;
            }

            // 命名颜色
            if (REV_COLOR[tagContent]) {
                var code = REV_COLOR[tagContent];
                var idx = lastColorIndex();
                if (idx >= 0) {
                    stack.splice(idx, 1);
                }
                stack.push(tagContent);
                out += '&' + code;
                i = end + 1;
                continue;
            }

            // 样式
            if (REV_STYLE[tagContent]) {
                var styleCode = REV_STYLE[tagContent];
                // 如果样式已存在，不重复添加
                if (stack.indexOf(tagContent) === -1) {
                    stack.push(tagContent);
                    out += '&' + styleCode;
                }
                i = end + 1;
                continue;
            }

            // 未知标签 → 当作普通文字
            // 如果是不支持的 hover:/click: 标签，需要括号计数来找到正确的 >
            /* 检查是否是不支持的标签（基础名或在基础名后跟冒号参数） */
            var tagBase = tagContent.replace(/:.*$/, '');
            if (U_BASES.indexOf(tagBase.toLowerCase()) !== -1) {
                var depth2 = 1;
                var inQ = false;
                var qc = '';
                var k = i + 1;
                while (k < input.length && depth2 > 0) {
                    var c2 = input[k];
                    if (c2 === '\\' && k + 1 < input.length) { k += 2; continue; }
                    if (inQ) { if (c2 === qc) inQ = false; }
                    else {
                        if (c2 === '\'' || c2 === '"') { inQ = true; qc = c2; }
                        else if (c2 === '<') depth2++;
                        else if (c2 === '>') depth2--;
                    }
                    k++;
                }
                out += input.slice(i, k);
                i = k;
            } else {
                out += input.slice(i, end + 1);
                i = end + 1;
            }
            continue;
        }

        // 普通字符
        out += ch;
        i++;
    }

    return out;
}

// ============================================================
// 3b. 不支持标签检测与去除
// ============================================================
/* 所有不支持的标签基础名（不含冒号参数） */
var U_BASES = [
    'hover','click','gradient','shadow','key','lang','lang_or','insert',
    'rainbow','transition','font','newline','selector','score','nbt',
    'pride','sprite','head'
];

/* 拼接成检测正则：匹配 <name 或 <name: */
var U_DETECT = new RegExp('<(?:' + U_BASES.join('|') + ')(?:[:>])', 'i');
var U_CLOSE_DETECT = new RegExp('</(?:' + U_BASES.join('|') + ')(?:[:>])', 'i');

function hasUnsupported(input) {
    return U_DETECT.test(input);
}

function stripUnsupported(input) {
    var out = '';
    var i = 0;
    while (i < input.length) {
        var rest = input.slice(i);

        /* Closing tag: </name> or </name:...> */
        var closeMatch = rest.match(U_CLOSE_DETECT);
        if (closeMatch && closeMatch.index === 0) {
            /* Skip to matching > */
            var closeEnd = input.indexOf('>', i);
            if (closeEnd !== -1) { i = closeEnd + 1; }
            else { i += closeMatch[0].length; }
            continue;
        }

        /* Opening tag: <name> or <name:...> */
        var openMatch = rest.match(U_DETECT);
        if (openMatch && openMatch.index === 0) {
            /* Bracket count to find matching > */
            var depth = 1;
            var inQ = false;
            var qc = '';
            var j = i + 1;
            while (j < input.length && depth > 0) {
                var ch = input[j];
                if (ch === '\\' && j + 1 < input.length) { j += 2; continue; }
                if (inQ) { if (ch === qc) inQ = false; }
                else {
                    if (ch === '\'' || ch === '"') { inQ = true; qc = ch; }
                    else if (ch === '<') depth++;
                    else if (ch === '>') depth--;
                }
                j++;
            }
            i = j;
            continue;
        }

        out += input[i];
        i++;
    }
    return out;
}

// ============================================================
// 4. 辅助函数
// ============================================================
function escapeMiniMessage(text) {
    return text.replace(/\\/g, '\\\\').replace(/</g, '\\<').replace(/>/g, '\\>');
}

// ============================================================
// 5. 预览渲染 (修复替换顺序)
// ============================================================
function renderMiniMessageToHTML(mmText) {
    if (!mmText) return '';

    var colorCSS = {
        'black': '#000000', 'dark_blue': '#0000AA', 'dark_green': '#00AA00',
        'dark_aqua': '#00AAAA', 'dark_red': '#AA0000', 'dark_purple': '#AA00AA',
        'gold': '#FFAA00', 'gray': '#AAAAAA', 'dark_gray': '#555555',
        'blue': '#5555FF', 'green': '#55FF55', 'aqua': '#55FFFF',
        'red': '#FF5555', 'light_purple': '#FF55FF', 'yellow': '#FFFF55',
        'white': '#FFFFFF'
    };

    var html = mmText
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

    // 先处理十六进制颜色 <color:#xxxxxx> 和 </color>
    // 使用更精确的匹配
    html = html.replace(/&lt;color:#([0-9a-fA-F]{6})&gt;/g, function(m, hex) {
        return '<span style="color:#' + hex + ';">';
    });
    html = html.replace(/&lt;\/color&gt;/g, '</span>');
    html = html.replace(/&lt;\/color:[^&]+&gt;/g, '</span>');

    /* <#xxxxxx> shorthand */
    html = html.replace(/&lt;#([0-9a-fA-F]{6})&gt;/g, function(m, hex) {
        return '<span style="color:#' + hex + ';">';
    });
    html = html.replace(/&lt;\/#([0-9a-fA-F]{6})&gt;/g, '</span>');

    // 再处理命名颜色 (按长度从长到短排序，避免冲突)
    var colorNames = Object.keys(colorCSS).sort(function(a, b) { return b.length - a.length; });
    for (var i = 0; i < colorNames.length; i++) {
        var name = colorNames[i];
        var css = colorCSS[name];
        var openRegex = new RegExp('&lt;' + name + '&gt;', 'g');
        var closeRegex = new RegExp('&lt;/' + name + '&gt;', 'g');
        html = html.replace(openRegex, '<span style="color:' + css + ';">');
        html = html.replace(closeRegex, '</span>');
    }

    // 样式标签
    var styleCSS = {
        'bold': 'font-weight:bold;',
        'italic': 'font-style:italic;',
        'underlined': 'text-decoration:underline;',
        'strikethrough': 'text-decoration:line-through;',
        'obfuscated': 'background:#333;color:#fff;'
    };

    var styleKeys = Object.keys(styleCSS);
    for (var j = 0; j < styleKeys.length; j++) {
        var sName = styleKeys[j];
        var sCss = styleCSS[sName];
        var sOpenRegex = new RegExp('&lt;' + sName + '&gt;', 'g');
        var sCloseRegex = new RegExp('&lt;/' + sName + '&gt;', 'g');
        html = html.replace(sOpenRegex, '<span style="' + sCss + '">');
        html = html.replace(sCloseRegex, '</span>');
    }

    // 清理残留的未知标签（含带冒号参数的闭合标签）
    html = html.replace(/&lt;\/?[a-z_]+&gt;/g, '');
    html = html.replace(/&lt;\/[a-z_]+:[^&]*&gt;/g, '');

    return html;
}

// ============================================================
// 6. UI 控制
// ============================================================
function updateAll() {
    var inputVal = document.getElementById('input').value;
    var output;
    var previewHtml;
    var warn = document.getElementById('unsupportedWarn');

    if (DIR === 0) {
        /* ChatColor → MiniMessage: no unsupported concern */
        warn.style.display = 'none';
        output = convertChatColorToMiniMessage(inputVal);
        previewHtml = renderMiniMessageToHTML(output);
        document.getElementById('output').value = output;
        document.getElementById('preview').innerHTML = previewHtml || '<span style="color:#B1B2B5;">（空）</span>';
    } else {
        /* MiniMessage → ChatColor */
        if (hasUnsupported(inputVal)) {
            /* Show warning, don't auto-convert */
            warn.style.display = 'block';
            document.getElementById('output').value = '';
            document.getElementById('preview').innerHTML = '<span style="color:#CA3636;">包含不支持的标签，请选择处理方式</span>';
        } else {
            warn.style.display = 'none';
            output = convertMiniMessageToChatColor(inputVal);
            previewHtml = renderMiniMessageToHTML(inputVal);
            document.getElementById('output').value = output;
            document.getElementById('preview').innerHTML = previewHtml || '<span style="color:#B1B2B5;">（空）</span>';
        }
    }
}

/* Force convert: treat hover/click as plain text */
function forceConvert() {
    var inputVal = document.getElementById('input').value;
    var output = convertMiniMessageToChatColor(inputVal);
    var previewHtml = renderMiniMessageToHTML(inputVal);
    document.getElementById('output').value = output;
    document.getElementById('preview').innerHTML = previewHtml || '<span style="color:#B1B2B5;">（空）</span>';
}

/* Strip then convert */
function stripConvert() {
    var inputVal = document.getElementById('input').value;
    var stripped = stripUnsupported(inputVal);
    var output = convertMiniMessageToChatColor(stripped);
    var previewHtml = renderMiniMessageToHTML(stripped);
    document.getElementById('output').value = output;
    document.getElementById('preview').innerHTML = previewHtml || '<span style="color:#B1B2B5;">（空）</span>';
}

function copyResult() {
    var output = document.getElementById('output');
    output.select();
    output.setSelectionRange(0, 99999);
    try {
        document.execCommand('copy');
        var toast = document.getElementById('copyToast');
        toast.classList.add('show');
        setTimeout(function() { toast.classList.remove('show'); }, 2000);
    } catch (err) {
        alert('复制失败，请手动复制。');
    }
}

function clearAll() {
    document.getElementById('input').value = '';
    document.getElementById('output').value = '';
    document.getElementById('preview').innerHTML = '<span style="color:#B1B2B5;">（将显示渲染后的效果）</span>';
    document.getElementById('unsupportedWarn').style.display = 'none';
}
